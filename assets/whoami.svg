<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="960" height="340" viewBox="0 0 960 340" role="img" aria-labelledby="title desc">
  <title id="title">Alfonso Salazar — Backend Developer</title>
  <desc id="desc">Tarjeta de perfil con estilo de terminal: foto, ubicación, estudios, enfoque y stack de Alfonso Salazar.</desc>
  <defs>
    <linearGradient id="brand" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f89820"/>
      <stop offset="1" stop-color="#6db33f"/>
    </linearGradient>
    <radialGradient id="glowOrange" cx="1" cy="0" r="0.9">
      <stop offset="0" stop-color="#f89820" stop-opacity=".16"/>
      <stop offset="1" stop-color="#f89820" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGreen" cx="0" cy="1" r="0.9">
      <stop offset="0" stop-color="#6db33f" stop-opacity=".16"/>
      <stop offset="1" stop-color="#6db33f" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="window"><rect x="1" y="1" width="958" height="338" rx="15"/></clipPath>
    <clipPath id="photo"><circle cx="160" cy="194" r="84"/></clipPath>
  </defs>

  <rect x="1" y="1" width="958" height="338" rx="15" fill="#0d1117"/>
  <g clip-path="url(#window)">
    <rect width="960" height="340" fill="url(#glowOrange)"/>
    <rect width="960" height="340" fill="url(#glowGreen)"/>
    <rect width="960" height="44" fill="#161b22"/>
    <path d="M0 44.5H960" stroke="#30363d"/>
  </g>
  <rect x="1" y="1" width="958" height="338" rx="15" fill="none" stroke="url(#brand)" stroke-width="2"/>
  <circle cx="30" cy="22" r="6" fill="#ff5f57"/>
  <circle cx="52" cy="22" r="6" fill="#febc2e"/>
  <circle cx="74" cy="22" r="6" fill="#28c840"/>
  <text x="480" y="27" text-anchor="middle" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13">whoami — zsh</text>

  <!-- foto -->
  <circle cx="160" cy="194" r="90" fill="none" stroke="url(#brand)" stroke-width="4"/>
  <image x="76" y="110" width="168" height="168" clip-path="url(#photo)" preserveAspectRatio="xMidYMid slice" xlink:href="data:image/jpeg;base64,"/>

  <!-- datos -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace">
    <text x="300" y="86" font-size="18"><tspan fill="#6db33f" font-weight="700">❯</tspan><tspan fill="#c9d1d9" dx="10">whoami</tspan></text>
    <text x="300" y="124" font-size="22" font-weight="700" fill="#e6edf3">alfonso_salazar<tspan fill="#8b949e" font-weight="400" dx="14">—</tspan><tspan fill="#f89820" dx="14">Backend Developer</tspan></text>
    <path d="M300 144.5H920" stroke="#30363d"/>
    <g font-size="16">
      <text x="300" y="180" fill="#8b949e">location:</text><text x="420" y="180" fill="#a5d6ff">Santa Marta, Colombia</text>
      <text x="300" y="214" fill="#8b949e">studying:</text><text x="420" y="214" fill="#d2a8ff">Ingeniería de Sistemas · U. del Magdalena</text>
      <text x="300" y="248" fill="#8b949e">focus:</text><text x="420" y="248" fill="#6db33f">APIs REST · Microservicios · Cloud</text>
      <text x="300" y="282" fill="#8b949e">stack:</text><text x="420" y="282" fill="#f89820">Java · Spring Boot · PostgreSQL · Docker</text>
      <text x="300" y="316" fill="#8b949e">mode:</text><text x="420" y="316" fill="#e6edf3">autodidacta · buenas prácticas</text>
    </g>
  </g>
</svg>
